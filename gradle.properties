# Project version (Semantic Versioning). Bump it together with CHANGELOG.md; pushing the tag v<version>
# publishes the GitHub Release (.github/workflows/release.yml).
version=1.0.0

# Configuration cache: besides speeding up builds, it lets independent tasks of the same project
# run in parallel (for example e2eAndroid and e2eIos with ./gradlew e2e).
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
