name: mobile-tests

on:
  push:
    branches: [main]
  pull_request:
  # E2E runs are manual only (Actions > mobile-tests > Run workflow): they need an emulator, a simulator or a
  # cloud account and use many Actions minutes (macOS minutes count 10x on private repositories).
  # Every push and pull request runs only the device-free "unit" job.
  workflow_dispatch:
    inputs:
      target:
        description: Where to run the E2E suite
        type: choice
        options: [android-emulator, ios-simulator, cloud]
        default: android-emulator
      environment:
        description: Cloud environment (only for target "cloud")
        type: choice
        options: [saucelabs, browserstack]
        default: saucelabs
      platform:
        description: Cloud platform (only for target "cloud"; BrowserStack is Android-only with the demo app)
        type: choice
        options: [Android, Ios]
        default: Android
      # Several devices at once: one job per entry (JSON list). Each device gets its own artifacts and the
      # "e2e-report" job merges every Allure result into a single report, with the device as a test parameter.
      android-api-levels:
        description: 'Android emulator API levels (target "android-emulator"), e.g. [31, 34, 35]'
        type: string
        default: '[34]'
      ios-devices:
        description: 'iOS simulators (target "ios-simulator"), e.g. ["iPhone 17", "iPhone 17 Pro"]'
        type: string
        default: '["iPhone 17"]'

# Least privilege for the GITHUB_TOKEN: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fast and device-free: static analysis, formatting, unit tests, coverage and SonarQube Cloud.
  unit:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud uses it to tell new code from old code (blame)
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      # Validates gradle-wrapper.jar and caches dependencies / configuration cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      # Skipped when the secret is not available (for example Dependabot or fork pull requests).
      # qualitygate.wait: the job fails if the Quality Gate fails, so the PR cannot be merged.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test

  # "ci" environment: Android emulator on the runner, Appium started by the framework.
  android-e2e:
    name: android-e2e (API ${{ matrix.api-level }})
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'android-emulator'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every device runs to the end: one failing device does not cancel the others
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.android-api-levels || '[34]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Native addons (coresim, tuntap) ship prebuilt binaries, so lifecycle scripts are not needed
      - run: npm ci --ignore-scripts
      - run: ./scripts/download-apps.sh
      - name: Enable KVM (accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: E2E Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew e2eAndroid -Penv=ci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results-api${{ matrix.api-level }}
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests
            build/appium-server-*.log

  # "ci" environment: iOS simulator on the macOS runner.
  ios-e2e:
    name: ios-e2e (${{ matrix.device }})
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ios-simulator'
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.ios-devices || '["iPhone 17"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Native addons (coresim, tuntap) ship prebuilt binaries, so lifecycle scripts are not needed
      - run: npm ci --ignore-scripts
      - run: ./scripts/download-apps.sh
      # The framework picks the simulator with this name and the newest iOS runtime (falls back to the newest
      # simulator if the name does not exist on the runner: check "Auto-selected iOS simulator" in the log).
      - name: E2E iOS
        env:
          DEVICE: ${{ matrix.device }}
        run: ./gradlew e2eIos -Penv=ci "-Pios.device.name=$DEVICE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results-${{ strategy.job-index }}
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests
            build/appium-server-*.log

  # "browserstack" / "saucelabs" environments: credentials as repository secrets.
  cloud-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'cloud'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: gh-${{ github.run_number }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./scripts/download-apps.sh
      - run: ./scripts/upload-app.sh "$CLOUD_ENV"
        env:
          CLOUD_ENV: ${{ inputs.environment }}
      - name: E2E ${{ inputs.platform }} on ${{ inputs.environment }}
        env:
          CLOUD_ENV: ${{ inputs.environment }}
          CLOUD_PLATFORM: ${{ inputs.platform }}
        run: ./gradlew "e2e$CLOUD_PLATFORM" "-Penv=$CLOUD_ENV"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-results-${{ inputs.environment }}-${{ inputs.platform }}
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests

  # One Allure report for every device of the run: merges the results of the matrix jobs (Allure file names are
  # unique, so nothing is overwritten). Open it with: allure generate <folder> -o report --clean && allure open report
  e2e-report:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.target != 'cloud'
    needs: [android-e2e, ios-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-results-*'
          path: downloaded
      - name: Merge the Allure results
        run: |
          mkdir -p allure-results
          find downloaded -path '*/allure-results/*' -type f -exec cp {} allure-results/ \;
          echo "Merged $(find allure-results -name '*-result.json' | wc -l | xargs) test results" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-all-devices
          path: allure-results
