name: mobile-tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual run against the cloud: Actions > mobile-tests > Run workflow
  workflow_dispatch:
    inputs:
      environment:
        description: Cloud environment
        type: choice
        options: [saucelabs, browserstack]
        default: saucelabs
      platform:
        description: Platform (BrowserStack is Android-only with the demo app)
        type: choice
        options: [Android, Ios]
        default: Android

concurrency:
  group: mobile-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fast and device-free: static analysis, formatting, unit tests, coverage and SonarQube Cloud.
  unit:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud uses it to tell new code from old code (blame)
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      # Validates gradle-wrapper.jar and caches dependencies / configuration cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      # Skipped when the secret is not available (for example Dependabot or fork pull requests).
      # qualitygate.wait: the job fails if the Quality Gate fails, so the PR cannot be merged.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test

  # "ci" environment: Android emulator on the runner, Appium started by the framework.
  android-e2e:
    if: github.event_name != 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Native addons (coresim, tuntap) ship prebuilt binaries, so lifecycle scripts are not needed
      - run: npm ci --ignore-scripts
      - run: ./scripts/download-apps.sh
      - name: Enable KVM (accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: E2E Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew e2eAndroid -Penv=ci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests
            build/appium-server-*.log

  # "ci" environment: iOS simulator on the macOS runner.
  ios-e2e:
    if: github.event_name != 'workflow_dispatch'
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Native addons (coresim, tuntap) ship prebuilt binaries, so lifecycle scripts are not needed
      - run: npm ci --ignore-scripts
      - run: ./scripts/download-apps.sh
      # Without device.udid / platform.version the framework picks the newest available simulator.
      - name: E2E iOS
        run: ./gradlew e2eIos -Penv=ci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests
            build/appium-server-*.log

  # "browserstack" / "saucelabs" environments: credentials as repository secrets.
  cloud-e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: gh-${{ github.run_number }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./scripts/download-apps.sh
      - run: ./scripts/upload-app.sh ${{ inputs.environment }}
      - name: E2E ${{ inputs.platform }} on ${{ inputs.environment }}
        run: ./gradlew e2e${{ inputs.platform }} -Penv=${{ inputs.environment }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-results-${{ inputs.environment }}-${{ inputs.platform }}
          path: |
            build/allure-results
            build/screenshots
            build/reports/tests
