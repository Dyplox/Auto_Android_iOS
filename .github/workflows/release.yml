name: release

# Publishes a GitHub Release when a v<version> tag is pushed:
#   1. In a pull request, set the version in gradle.properties and move the [Unreleased] notes of CHANGELOG.md
#      to a "## [<version>] - <date>" section.
#   2. After merging it: git tag v<version> origin/main && git push origin v<version>
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creates the release
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check that the tag matches the project version and the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match version=$version in gradle.properties"
            exit 1
          fi
          # Release notes: the CHANGELOG.md section of this version, without its heading
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The release is only published if the code at the tag still builds and passes the unit tests
      - run: ./gradlew build javadoc
      - name: Package the Javadoc
        run: (cd build/docs/javadoc && zip -qr "$GITHUB_WORKSPACE/javadoc-$VERSION.zip" .)
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" "javadoc-$VERSION.zip" --title "$TAG" --notes-file release-notes.md --verify-tag
