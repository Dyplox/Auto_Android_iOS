[versions]
appium-java-client = "11.0.0"
# java-client 11.0.0 is certified with Selenium 4.50.0 (official compatibility matrix)
selenium = "4.50.0"
junit = "6.1.3"
assertj = "3.27.7"
allure = "3.1.1"
# 1.9.27 is the first AspectJ release that can weave Java 27 bytecode
aspectj = "1.9.27"
slf4j = "2.0.20"
logback = "1.6.7"
jspecify = "1.0.1"

# --- Build quality tools ---------------------------------------------------------------
errorprone = "2.52.0"
nullaway = "0.14.3"
# 0.8.16 is the first JaCoCo release that officially supports Java 27
jacoco = "0.8.16"

[libraries]
appium-java-client = { module = "io.appium:java-client", version.ref = "appium-java-client" }
selenium-api = { module = "org.seleniumhq.selenium:selenium-api", version.ref = "selenium" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

allure-bom = { module = "io.qameta.allure:allure-bom", version.ref = "allure" }
allure-java-commons = { module = "io.qameta.allure:allure-java-commons" }
allure-jupiter = { module = "io.qameta.allure:allure-jupiter" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
test-retry = { id = "org.gradle.test-retry", version = "1.6.6" }
sonarqube = { id = "org.sonarqube", version = "7.6.0.18749" }
