# Pruebas unitarias del framework: son puras e independientes, así que corren en paralelo (FIRST: Fast).
# Las tareas e2eAndroid / e2eIos lo desactivan (-Djunit.jupiter.execution.parallel.enabled=false):
# un dispositivo solo puede ejecutar un test a la vez.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
