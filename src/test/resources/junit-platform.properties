# Framework unit tests are pure and independent, so they run in parallel (FIRST: Fast).
# The e2eAndroid / e2eIos tasks turn this off (-Djunit.jupiter.execution.parallel.enabled=false):
# a device can only run one test at a time.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
