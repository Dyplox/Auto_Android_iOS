# =====================================================================================
#  Base configuration, shared by Android and iOS and by every environment.
#
#  Layers (from highest to lowest priority):
#    -P<platform>.<key> / -P<key>            ./gradlew e2eIos -Pios.device.name="iPhone 17 Pro"
#    environment variables (or .env file)    IOS_DEVICE_NAME=... / APPIUM_SERVER_URL=...
#    config/env/<environment>-<platform>.properties
#    config/env/<environment>.properties     environment: -Penv=local|ci|browserstack|saucelabs (or TEST_ENV)
#    config/<platform>.properties
#    this file
#
#  Values support ${VARIABLE} and ${VARIABLE:-default} (environment variables or .env):
#  credentials are never written in these files.
# =====================================================================================

# --- Appium server -------------------------------------------------------------------
# false: use a server that is already running at appium.server.url (local: npm run appium; cloud: provider hub).
# true: each test JVM starts its own local server on a free port and stops it at the end.
appium.server.autostart=false
appium.server.url=http://127.0.0.1:4723

# --- Timeouts ------------------------------------------------------------------------
timeout.explicit.seconds=20
timeout.polling.millis=250
timeout.new-command.seconds=240

# --- Session -------------------------------------------------------------------------
# false = Appium resets the app to a clean state when the session starts
session.no-reset=false

# --- Device --------------------------------------------------------------------------
# Local iOS: if there is no device.udid or platform.version, pick a simulator with xcrun simctl
device.simulator.auto-select=true

# --- Navigation ----------------------------------------------------------------------
# tabbar   -> navigates through the UI like a user (default)
# deeplink -> opens the screen directly with wdio://<screen> (faster)
navigation.strategy=tabbar
app.deeplink.scheme=wdio://
