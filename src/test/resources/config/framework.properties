# =====================================================================================
#  Configuración base, común a Android e iOS y a todos los ambientes.
#
#  Capas (de mayor a menor prioridad):
#    -P<plataforma>.<clave> / -P<clave>      ./gradlew e2eIos -Pios.device.name="iPhone 17 Pro"
#    variables de entorno (o archivo .env)   IOS_DEVICE_NAME=... / APPIUM_SERVER_URL=...
#    config/env/<ambiente>-<plataforma>.properties
#    config/env/<ambiente>.properties        ambiente: -Penv=local|ci|browserstack|saucelabs (o TEST_ENV)
#    config/<plataforma>.properties
#    este archivo
#
#  Los valores admiten ${VARIABLE} y ${VARIABLE:-por defecto} (variables de entorno o .env):
#  las credenciales nunca se escriben en estos archivos.
# =====================================================================================

# --- Appium server -------------------------------------------------------------------
# false: usa un server ya levantado en appium.server.url (local: npm run appium; nube: hub del proveedor).
# true: cada JVM de pruebas inicia su propio server local en un puerto libre y lo detiene al terminar.
appium.server.autostart=false
appium.server.url=http://127.0.0.1:4723

# --- Timeouts ------------------------------------------------------------------------
timeout.explicit.seconds=20
timeout.polling.millis=250
timeout.new-command.seconds=240

# --- Sesión --------------------------------------------------------------------------
# false = Appium deja la app en estado limpio al iniciar la sesión
session.no-reset=false

# --- Dispositivo ---------------------------------------------------------------------
# iOS local: si no hay device.udid ni platform.version, elegir un simulador con xcrun simctl
device.simulator.auto-select=true

# --- Navegación ----------------------------------------------------------------------
# tabbar   -> navega por la UI como un usuario (por defecto)
# deeplink -> abre la pantalla directo con wdio://<pantalla> (más rápido)
navigation.strategy=tabbar
app.deeplink.scheme=wdio://
