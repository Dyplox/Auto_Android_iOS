# =====================================================================================
#  iOS  (XCUITest) - the demo app only ships a SIMULATOR build
# =====================================================================================
# If device.udid and platform.version are empty, the framework picks a simulator with
# "xcrun simctl": first a booted one, then "device.name" on the newest runtime.
# To pin one:  xcrun simctl list devices available
device.name=iPhone 17
device.udid=
platform.version=

app.path=apps/ios.simulator.wdio.native.app.v2.2.0.zip
app.id=org.wdiodemoapp

# --- Additional capabilities: capability.<name>=<value>  (sent as appium:<name>)
# The first launch builds WebDriverAgent: it can take several minutes.
capability.wdaLaunchTimeout=180000
capability.simulatorStartupTimeout=180000
capability.maxTypingFrequency=30
# To run several simulators in parallel, each thread needs its own port:
# capability.wdaLocalPort=8101
