# =====================================================================================
#  iOS  (XCUITest) - la app demo solo existe como build de SIMULADOR
# =====================================================================================
# Si device.udid y platform.version quedan vacíos, el framework elige un simulador con
# "xcrun simctl": primero uno encendido, luego "device.name" en el runtime más nuevo.
# Para fijar uno:  xcrun simctl list devices available
device.name=iPhone 17
device.udid=
platform.version=

app.path=apps/ios.simulator.wdio.native.app.v2.2.0.zip
app.id=org.wdiodemoapp

# --- Capabilities adicionales: capability.<nombre>=<valor>  (se envían como appium:<nombre>)
# El primer arranque compila WebDriverAgent: puede tardar varios minutos.
capability.wdaLaunchTimeout=180000
capability.simulatorStartupTimeout=180000
capability.maxTypingFrequency=30
# Para varios simuladores en paralelo, cada hilo necesita su propio puerto:
# capability.wdaLocalPort=8101
