# =====================================================================================
#  Android  (UiAutomator2)
# =====================================================================================
# Sin device.udid, Appium usa el primer emulador/dispositivo de "adb devices".
device.name=Android Emulator
device.udid=
platform.version=

app.path=apps/android.wdio.native.app.v2.2.0.apk
app.id=com.wdiodemoapp

# --- Capabilities adicionales: capability.<nombre>=<valor>  (se envían como appium:<nombre>)
capability.appWaitActivity=com.wdiodemoapp.MainActivity
# Descomenta para que Appium encienda el emulador por ti (nombre del AVD en Android Studio):
# capability.avd=Pixel_9_API_36
# Para varios dispositivos en paralelo, cada hilo necesita su propio puerto:
# capability.systemPort=8201
