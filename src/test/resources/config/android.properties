# =====================================================================================
#  Android  (UiAutomator2)
# =====================================================================================
# Without device.udid, Appium uses the first emulator/device listed by "adb devices".
device.name=Android Emulator
device.udid=
platform.version=

app.path=apps/android.wdio.native.app.v2.2.0.apk
app.id=com.wdiodemoapp

# --- Additional capabilities: capability.<name>=<value>  (sent as appium:<name>)
capability.appWaitActivity=com.wdiodemoapp.MainActivity
# Uncomment to let Appium boot the emulator for you (AVD name from Android Studio):
# capability.avd=Pixel_9_API_36
# To run several devices in parallel, each thread needs its own port:
# capability.systemPort=8201
