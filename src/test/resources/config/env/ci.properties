# =====================================================================================
#  Environment: ci  (GitHub Actions or another pipeline with an emulator / simulator)
#  Each JVM starts its own Appium; CI machines are slower than a laptop.
#  Usage: ./gradlew e2eAndroid -Penv=ci
# =====================================================================================
appium.server.autostart=true
timeout.explicit.seconds=40
timeout.new-command.seconds=300
device.simulator.auto-select=true
