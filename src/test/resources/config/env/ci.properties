# =====================================================================================
#  Ambiente: ci  (GitHub Actions u otro pipeline con emulador / simulador)
#  Cada JVM levanta su propio Appium; las máquinas de CI son más lentas que un portátil.
#  Uso: ./gradlew e2eAndroid -Penv=ci
# =====================================================================================
appium.server.autostart=true
timeout.explicit.seconds=40
timeout.new-command.seconds=300
device.simulator.auto-select=true
