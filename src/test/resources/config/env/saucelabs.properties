# =====================================================================================
#  Environment: saucelabs  (Sauce Labs, Android emulators and iOS simulators)
#  Credentials: SAUCE_USERNAME / SAUCE_ACCESS_KEY; optional region SAUCE_REGION (us-west-1 | eu-central-1)
#  1) ./scripts/upload-app.sh saucelabs      2) ./gradlew e2e -Penv=saucelabs
# =====================================================================================
appium.server.url=https://ondemand.${SAUCE_REGION:-us-west-1}.saucelabs.com/wd/hub
appium.server.autostart=false
device.simulator.auto-select=false
timeout.explicit.seconds=30

# Everything Sauce Labs-specific goes inside the sauce:options capability.
# Each cloud.option.<key> is sent as sauce:options.<key>.
cloud.options-capability=sauce:options
cloud.option.username=${SAUCE_USERNAME}
cloud.option.accessKey=${SAUCE_ACCESS_KEY}
cloud.option.appiumVersion=stable
cloud.option.build=${BUILD_NAME:-local}
# Name of each session on the dashboard: the framework uses the test class name
cloud.session-name-option=name
