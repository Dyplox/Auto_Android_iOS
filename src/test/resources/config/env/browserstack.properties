# =====================================================================================
#  Environment: browserstack  (BrowserStack App Automate, real devices)
#  Credentials: BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY (environment variables or .env)
#  1) ./scripts/upload-app.sh browserstack      2) ./gradlew e2eAndroid -Penv=browserstack
# =====================================================================================
appium.server.url=https://hub-cloud.browserstack.com/wd/hub
appium.server.autostart=false
device.simulator.auto-select=false
timeout.explicit.seconds=30

# Everything BrowserStack-specific goes inside the bstack:options capability.
# Each cloud.option.<key> is sent as bstack:options.<key>.
cloud.options-capability=bstack:options
cloud.option.userName=${BROWSERSTACK_USERNAME}
cloud.option.accessKey=${BROWSERSTACK_ACCESS_KEY}
cloud.option.projectName=Reto SDET - Appium Android iOS
cloud.option.buildName=${BUILD_NAME:-local}
cloud.option.debug=true
cloud.option.networkLogs=true
# Name of each session on the dashboard: the framework uses the test class name
cloud.session-name-option=sessionName
